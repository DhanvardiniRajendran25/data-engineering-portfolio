name: CI

on:
  push:
    branches: [main, rewrite/nextjs]
  pull_request:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` over `npm install`: installs exactly the lockfile, and fails
      # if package.json and the lockfile have drifted apart.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: web/.next
          retention-days: 1

  accessibility:
    name: Accessibility (axe)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      # All three engines. Chromium alone previously hid a WebKit-only
      # regression where a CSP directive broke every stylesheet.
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build

      - name: Run axe against every route
        run: npm run test:a11y

  lighthouse:
    name: Lighthouse budgets
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Lighthouse budgets (desktop)
        run: npx --yes @lhci/cli@0.14.x autorun --config=lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      # Simulated slow 4G plus 4x CPU throttling. Desktop runs unthrottled and
      # will not catch a regression that only hurts phones.
      - name: Lighthouse budgets (mobile, throttled)
        run: npx --yes @lhci/cli@0.14.x autorun --config=lighthouserc.mobile.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
