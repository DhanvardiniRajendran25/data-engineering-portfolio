name: data-pipeline

# Manual trigger only until Phase 5 ships with a real dataset and a
# DATABASE_URL repo secret. Once that lands, uncomment the schedule
# below to run on a cadence (e.g. every 6 hours).
on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "0 */6 * * *"

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/ingest.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
